server:
  port: 14132

spring:
  codec:
    max-in-memory-size: 50MB
  application:
    name: api-gateway
  cloud:
    gateway:
      globalcors:
        add-to-simple-url-handler-mapping: true
        corsConfigurations:
          '[/**]':
            allowedOriginPatterns: "*"
            allowedMethods: "*"
            allowedHeaders: "*"
            allowCredentials: true
      httpclient:
        connect-timeout: 15000
        response-timeout: 120s
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      routes:
        - id: user-service-auth
          uri: lb://user-service
          predicates:
            - Path=/auth/**

        - id: user-service-api
          uri: lb://user-service
          predicates:
            - Path=/api/user/**
          filters:
            # /api/user/profile → /user/profile（与 UserController @RequestMapping("/user") 对齐）
            - StripPrefix=1

        - id: user-service-profile
          uri: lb://user-service
          predicates:
            - Path=/user/**

        - id: ai-evaluation-service
          uri: lb://ai-evaluation-service
          predicates:
            - Path=/api/ai/**

        - id: ai-evaluation-question-bank
          uri: lb://ai-evaluation-service
          predicates:
            - Path=/api/question-bank/**

        - id: resume-service
          uri: lb://resume-service
          predicates:
            - Path=/api/resume/**

        - id: radar-evaluation-service
          uri: lb://radar-evaluation-service
          predicates:
            - Path=/api/radar/**

        - id: radar-chart-service
          uri: lb://radar-evaluation-service
          predicates:
            - Path=/api/radar-chart/**

        - id: student-service
          uri: lb://student-service
          predicates:
            - Path=/api/student/**
          filters:
            - StripPrefix=1

        # /api/growth/** → Strip 掉 api → /growth/**（对齐 GrowthRecordController 的 @RequestMapping("/growth")）
        - id: growth-service
          uri: lb://student-service
          predicates:
            - Path=/api/growth/**
          filters:
            - StripPrefix=1

        # 反向代理若已剥掉外层 /api（客户端仍请求的是 .../growth/**），兜底直连学生服务同一套控制器
        - id: growth-service-no-api-prefix
          uri: lb://student-service
          predicates:
            - Path=/growth/**

        - id: forum-service
          uri: lb://student-service
          predicates:
            - Path=/api/forum/**
          filters:
            - StripPrefix=1

        - id: sensitive-service
          uri: lb://student-service
          predicates:
            - Path=/api/sensitive/**
          filters:
            - StripPrefix=1

        - id: help-service
          uri: lb://student-service
          predicates:
            - Path=/api/help/**
          filters:
            - StripPrefix=1

        - id: chat-service-api
          uri: lb://chat-service
          predicates:
            - Path=/api/chat/**

        - id: chat-service-admin
          uri: lb://chat-service
          predicates:
            - Path=/api/admin/**

        - id: recruitment-service
          uri: lb://recruitment-service
          predicates:
            - Path=/api/recruitment/**

        - id: galaxy-service
          uri: lb://galaxy-service
          predicates:
            - Path=/api/galaxy/**

# Eureka Client 配置
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

# 日志配置
logging:
  level:
    root: INFO
    org.springframework.cloud.gateway: INFO
