server:
  port: 14140

spring:
  application:
    name: galaxy-service

galaxy:
  # C++ galaxy-graph（可选）。须与 resume-pdf 服务错开端口；默认 22571。示例: http://127.0.0.1:22571
  cpp:
    graph-base-url: ""
  # Python galaxy 聚合（可选）。示例: http://127.0.0.1:15100
  python:
    base-url: ""
    # 兼容：仅配置了推荐旧地址时仍可用
    recommend-base-url: ""

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

logging:
  level:
    root: INFO
    com.offercat.galaxy: INFO
