server:
  port: 8082

spring:
  application:
    name: student-service
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/offercat?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=UTC
    username: root
    password: 1029384756
    driver-class-name: com.mysql.cj.jdbc.Driver
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB

file:
  forum-images-dir: D:/offercat/photo/

mybatis:
  mapper-locations: classpath:mapper/*.xml
